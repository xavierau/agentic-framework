[project]
name = "agentic-framework"
version = "0.1.0"
description = "A multi-agent framework with team-based orchestration and message bus communication"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pydantic>=2.5.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "asyncio-mqtt>=0.16.0",
    "typing-extensions>=4.8.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "dspy>=2.0.0",
    "click>=8.0.0",
    "aioredis>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=26.10.1",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
agentic = "agentic_framework.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
